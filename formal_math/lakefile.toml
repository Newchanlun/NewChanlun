name = "chan"
version = "0.1.0"
defaultTargets = ["Chan", "ChanTest", "ChanDyn"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
linter.unusedVariables = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.36.0"

[[lean_lib]]
name = "Chan"
globs = ["Chan.*"]

[[lean_lib]]
name = "ChanTest"
roots = ["ChanTest.Probe"]
globs = ["ChanTest.+"]

[[lean_lib]]
name = "ChanDyn"
globs = ["ChanDyn.+"]
