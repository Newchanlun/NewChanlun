  target_audit_status: "已否证"
  exact_proposition: "080:30 在“离开就是唯一的选择”之后紧接明列顶分型后“1、形成笔；2、不形成笔”，并未承诺此后不创新高，因此仅说明其把操作离场决策建立在必要条件（080:28）上而不为其建立价格上界反驳；对 108:18“有效站住分型区间上边沿，就意味着底部构造成功并至少展开一笔一上行情”（及二级旁证 104:282 跌破边沿必成笔），原文未定义“有效站住”，此处在显式因果站稳确认条件（全段守住上边沿且严格站上）下，严格分开有效确认、行情演化直至实际跌破底分型最低点闭合失败（杜绝拿截短上涨前缀反驳最终结论）与方向正确包含合并后的不共用顶分型/成笔确认。待下游 Chan/Audit/Math 证伪闭合命题 b36_standAboveEdgeEnsuresPenBeforeFailureLiteral。"
  citations:
    - cite: "080:28"
      tier: 1
      source_tag: "[一级正文]"
      admit_id: 1237
      quote: "一、所有的顶点都必然是顶分型。"
    - cite: "080:30"
      tier: 1
      source_tag: "[一级正文]"
      admit_id: 1238
      quote: "从这可以严格推导出什么？就是一旦出现顶分型，离开就是唯一的选择。"
    - cite: "080:30"
      tier: 2
      source_tag: "[二级旁证]"
      admit_id: null
