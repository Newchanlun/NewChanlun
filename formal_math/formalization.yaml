  exact_proposition: "054:60 的“该卖点后一定继续向下”本身不排斥局部下跌后再上涨，086:76 亦明言下跌趋势底背驰转折后的第一个上去的线段卖点虽按纯结构定义构成最后中枢第三类卖点，但“几乎没有任何的操作意义，反而是要考虑下来的那个第二类买点”。严格比较同一时间窗口（紧接三卖的下一段向下次级别走势 nextDownLegLow），必须将“存在局部向下回落并构成不破前低的第二类买点（b14_nextLegFormsNonBreakingSecondBuy）”与“延续原下跌趋势破底创新低（b14_nextLegBreaksPriorLow）”分离，待下游 Chan/Audit/Math 证明分离见证 b14_bottomThirdSellSeparatesFromTrendBreak。"
  citations:
    - cite: "086:76"
      tier: 1
      source_tag: "[一级正文]"
      admit_id: 1325
      quote: "而且，必须注意，对于趋势的转折来说，例如上面的1分钟下跌趋势，最后背驰转折后，第一个上去的线段卖点，很有可能刚好形成最后一个1分钟中枢的第三类卖点，这时候，这个卖点，几乎没有任何的操作意义，反而是要考虑下来的那个第二类买点。很多抄底的人，经常在第一次冲起后就给震掉，然后再追高买回来，就是没搞清楚这种关系。"
    - cite: "086:28"
      tier: 1
      source_tag: "[一级正文]"
      admit_id: 1318
      quote: "而且，很有可能，一个小级别的第三类卖点后，反而延伸出大级别的买点，这在震荡中太常见了。"
    - cite: "054:60"
      tier: 1
      source_tag: "[一级正文]"
      admit_id: 877
      quote: "注意，并不是说一定要形成该级别第三类卖点后才能大幅度下跌，完全可以用该级别以下小级别的第三类卖点就突破中枢，但有一点是肯定的，就是只要足够长时间，该级别的这第三类卖点一定会出现的，当然，在最极端的情况下，这个卖点离中枢很远的位置了，但有一点是肯定的，就是该卖点后一定继续向下。"
  literal_lean_defs:
