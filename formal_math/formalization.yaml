- id: "B-9"
  title: "方向合法的相邻非极值端点线段经独立标准化后折线断开"
  target_modules:
    - "Chan.Defs.Order"
    - "Chan.Defs.Segment"
    - "Chan.Audit.Literal.OrderAndCenter"
    - "#2323"
  disposition: "定义"
  delivery_state: "待证反例陈述"
  audit_status: null
  target_audit_status: "已否证"
  exact_proposition: "正文 078:58 与 078:60 宣称当线段最高低点不在端点时，可将每条线段标准化为端点即极值并形成“延续不断、首尾相连的折线”；但 070:48 与 078:42 明确允许线段端点不是极值。即使严格强制原始线段满足 078:20 的方向一致性（向上段起点严低于终点、向下段终点严低于起点，由 directedSegValid 与 b9_adjacentValidConnectedSegs 保障），只要端点非极值，独立标准化仍会使相邻段端点断开。待下游 Chan/Audit/Math 证伪 b9_standardizedAlwaysConnectedLiteral。"
  citations:
    - cite: "078:20"
      tier: 1
      source_tag: "[一级正文]"
      admit_id: 1212
      quote: "同样，正如同一笔不可能出现顶低于底的情况，同一线段中，两端的一顶一底，顶肯定要高于底，如果你划出一个不符合这基本要求的线段，那肯定是划错了。"
    - cite: "078:58"
      tier: 1
      source_tag: "[一级正文]"
      admit_id: 1219
      quote: "注意，这里必须提醒一句，就是这在以前也曾说过，就是，如果线段中，最高或最低点不是线段的端点，那么，在任何以线段为基础的分析中，例如把线段为基础构成最小级别的中枢等，都可以把该线段标准化为最高低点都在端点。因为，在以线段为基础的分析中，都把线段当成一个没有内部结构的基本部件，所以，只需要关心这线段的实际区间就可以，这样就可以只看其高低点。"
    - cite: "078:60"
      tier: 1
      source_tag: "[一级正文]"
      admit_id: 1220
      quote: "经过标准化处理后，所有向上线段都是以最低点开始最高点结束，向下线段都是以最高点开始最低点结束，这样，所以线段的连接，就形成一条延续不断、首尾相连的折线，这样，复杂的图形，就会十分地标准化，也为后面的中枢、走势类型等分析提供了最标准且基础的部件。"
    - cite: "070:48"
      tier: 1
      source_tag: "[一级正文]"
      admit_id: 1123
      quote: "没有人规定分段的结束位置一定是最高、最低的，关键要有至少三笔，因为从37开始到最高的位置，没有三笔，所以不能认为线段已经完成。"
    - cite: "078:42"
      tier: 1
      source_tag: "[一级正文]"
      admit_id: 1216
      quote: "这种情况下，如果那向上笔突破线段B的高点，这时候就会出现，线段的开始点并不是最高点的情况。"
    - cite: "054:54"
      tier: 1
      source_tag: "[一级正文]"
      admit_id: 875
      quote: "三个小括弧里的1分钟中枢重叠构成了大括弧里的5分钟高一级别中枢。中枢的区间是[d2，g5]，注意，这时候，就要把1分钟的走势当成线段，小括弧里的都是线段，高低点就是这线段的端点。"
  literal_lean_defs:
    - "Chan.Audit.Literal.directedSegValid"
    - "Chan.Audit.Literal.b9_adjacentValidConnectedSegs"
    - "Chan.Audit.Literal.b9_standardizeSegLiteral"
    - "Chan.Audit.Literal.b9_standardizedAlwaysConnectedLiteral"
  history_revision: "直接修订抽象核输入结构——由“首尾相连的折线”改为“方向交替的闭区间序列”，仅依赖方向与值域 [低, 高]，消除方向合法但端点非极值线段独立标准化导致的折线断开。"

