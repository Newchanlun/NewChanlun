  exact_proposition: "084:60/102:28（及二级旁证 060:174）强调级别本质与时间周期图无关且名字可任意取，但 100:24 将 6124 下跌称为 30 分钟下跌、二级旁证 102:346 又称之为“60 分钟图上连 1 分钟中枢都没形成”，108:20 按图周期定义“分型意义上的日线级别底部”，091:46 状态矩阵亦按固定时间周期排列；跨基底既无换算定理，也须把分型意义级别与走势类型级别异名分立。"
