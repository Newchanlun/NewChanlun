  exact_proposition: "原典在 020:62 早期即已明言第三类买卖点后并不必然是趋势、也有进入更大级别盘整的可能，但 020:62/021:22/054:60 及二级旁证 053:151（限定于上涨股票、日线级别）/080:110 仍作出必然赢利、100% 安全、100% 获利或必然转折的强保证；至晚期正文 107:22 明确收缩为不保证更高高点、可能连手续费都不够的“只有相对的理论上的绝对安全性，而没有具体操作上的绝对安全性”。强收益断言与可证的弱结构结论之间须严格分离。"
