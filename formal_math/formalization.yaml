    - cite: "070:180"
      tier: 2
      admit_id: null
      quote: "但理论从来不保证，向上以后就不再向下。"
    - cite: "108:178"
      tier: 2
      admit_id: null
      quote: "这次反弹的技术性由此可见，昨天中午强调最恶劣情况下，最基本升幅已经达到，结果大盘无情选择最恶劣的情况，这是理论所允许，感情所必须接受的。"
