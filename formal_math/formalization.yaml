- id: "B-13"
  title: "买卖点完备性定理与中枢震荡买卖点、多回试点的名称与结构分离"
  target_modules:
    - "Chan.Defs.Signals"
    - "#2323"
  disposition: "定义"
  delivery_state: "已转主线定义"
  audit_status: null
  target_audit_status: "已分离"
  exact_proposition: "021:62 买卖点完备性定理宣称必然产生赢利的买卖点“只有第一、二、三类”，但 101:42 与 049:46 明确区分中阴阶段的第一、二类买卖点与中枢震荡阶段的第三类买卖点及“中枢震荡的买卖点”（盘整背驰点），060:50 亦说明盘整背驰严格上不算第一类买点；101:40 则说明二三买之间的震荡买点在名称上一般不另命名、亦可归作第二类买点（此处属名称归并讨论而非宣称互斥第四结构）。同时完备性未说明相对何种结构集合及为何附带“必然赢利”，主线需按阶段分层命名并改写为纯结构起终点覆盖命题。"
  citations:
    - cite: "021:62"
      tier: 1
      source_tag: "[一级正文]"
      admit_id: 298
      quote: "缠中说禅买卖点的完备性定理：市场必然产生赢利的买卖点，只有第一、二、三类。"
    - cite: "021:22"
      tier: 1
      source_tag: "[一级正文]"
      admit_id: 280
      quote: "市场交易，归根结底就是买卖点的把握，买卖点的完备性就是理论的完备性。"
    - cite: "101:42"
      tier: 1
      source_tag: "[一级正文]"
      admit_id: 1443
      quote: "注意，只有在这回升的中阴状态下才有第一、二类买点，中阴状态结束后，所有的中枢震荡只存在第三类买卖点以及中枢震荡的买卖点，就不存在第一、二类买卖点了。"
    - cite: "101:40"
      tier: 1
      source_tag: "[一级正文]"
      admit_id: 1442
      quote: "那第二类与第三类买点之间的震荡买点，一般就不给特别的名称了，当然，也可以看成是第二类买点，这样，并没有多大的影响。"
    - cite: "049:46"
      tier: 1
      source_tag: "[一级正文]"
      admit_id: 786
      quote: "显然，对于一个中枢来说，最有价值的买点就是其第三类买点以及中枢向下震荡力度出现背驰的买点。"
    - cite: "060:50"
      tier: 1
      source_tag: "[一级正文]"
      admit_id: 956
      quote: "显然，46-55是一个5分钟的中枢，55跌破53后明显盘整背驰，各位也不难发现，如果把55当成第一类买点（严格来说，盘整背驰无所谓第一类买点，只是这样来类比），57就是一个第二类买点。"
  literal_lean_defs: []
  history_revision: "主线买卖点谓词族按中阴阶段（一买卖、二买卖及其后回试点）、中枢震荡阶段（盘整背驰震荡买卖点）、离开阶段（三买卖）分层命名，完备性改写为纯结构起终点覆盖命题，区分名称归并与结构分类。"

- id: "B-14"
  title: "底部纯结构第三类卖点在同一时间窗口内与“延续趋势破底续跌”的语义分离"
  target_modules:
