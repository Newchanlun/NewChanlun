- id: "B-27"
  title: "五组核心术语与记号漂移（扩张/扩展、次级别、Zn、底部、线段）"
  target_modules:
    - "Chan.Defs.Glossary"
    - "#2323"
  disposition: "定义"
  delivery_state: "已转主线定义"
  audit_status: null
  target_audit_status: "已分离"
  exact_proposition: "原典中“扩张/扩展”（单中枢 vs 两中枢结合）、“次级别”（最低级以下统称线段 vs 须具上下上结构）、“Zn”（Z 走势段 / 震荡中轴 / 周线标号）、“底部”（走势类型版 108:14 vs 分型版 108:18）与“线段”（第 62 课起由笔构成 vs 053:18 泛指任何被视作无内部结构的次级别走势）均存在一词多义漂移。"
  citations:
    - cite: "057:26"
      tier: 1
      source_tag: "[一级正文]"
      admit_id: 916
      quote: "对着图，首先要确定最小分析级别，也就是说，这级别以下的都可以看成是线段，而站在最小分析级别的角度，每一线段就是其次级别走势类型，三个线段重合部分就构成最小分析级别的中枢。"
    - cite: "057:32"
      tier: 1
      source_tag: "[一级正文]"
      admit_id: 919
      quote: "由于前面12、23、34构成的中枢只有1分钟级别的，那么其构成第三类卖点的次级别就是1分钟以下级别的线段，这时候，就要考察一个有上下上结构的1分钟的次级别结构了，而56段显然符合这个结构，有明显的上下上，而45段也是符合1分钟次级别的要求的，注意，当考察1分钟的次级别时，就不能笼统地把所有1分钟以下的都看成1分钟的次级别了，因为这里的视点已经不同。"
    - cite: "020:52"
      tier: 1
      source_tag: "[一级正文]"
      admit_id: 263
      quote: "为方便起见，以后都把这些与中枢方向一致的次级别走势类型称为Z走势段，按中枢中的时间顺序，分别记为Zn等，而相应的高、低点分别记为gn、dn,定义四个指标：GG=max(gn),G=min(gn),D=max(dn),DD=min(dn)，n遍历中枢中所有Zn。"
    - cite: "092:18"
      tier: 1
      source_tag: "[一级正文]"
      admit_id: 1378
      quote: "一个中枢确立后，中枢区间的一半位置，称为震荡中轴Z。而每一个次级震荡区间的一半位置，依次用Zn表示，当然，最标准的状态，就是Zn刚好就是Z，但这是很特殊的例子。"
    - cite: "088:38"
      tier: 1
      source_tag: "[一级正文]"
      admit_id: 1338
      quote: "为了方便明确起见，还是把记号的级别进行分类，例如，用Xn代表线段的记号，用Yn代表1分钟的级别，Wn代表5分钟的记号，Sn代表30分钟记号。日、周、月、季、年，分别也可以用Rn、Zn、Mn、Jn、Nn来表示。其中的n都是具体的数字，这样，所有的走势，都可以被这个标号体系所标记而清楚异常了。"
    - cite: "108:14"
      tier: 1
      source_tag: "[一级正文]"
      admit_id: 1563
      quote: "何谓底部？这里给出精确的定义，以后就不会糊涂一片了。底部都是分级别的，如果站在精确走势类型的角度，那么第一类买点出现后一直到该买点所引发的中枢第一次走出第三类买卖点前，都可以看成底部构造的过程。只不过如果是第三类卖点先出现，就意味着这底部构造失败了，反之，第三类买点意味着底部构造的最终完成并展开新的行情。当然，顶部的情况，反过来定义就是。"
    - cite: "108:18"
      tier: 1
      source_tag: "[一级正文]"
      admit_id: 1564
      quote: "站在分型的角度，底部就是构成底分型的那个区间，而跌破分型最低点意味着底部构成失败，反之，有效站住分型区间上边沿，就意味着底部构造成功并至少展开一笔一上行情。其实，这都不是什么新鲜内容，但这里统一说出来，还是有好处的。同样，顶部反过来就是。"
    - cite: "053:18"
      tier: 1
      source_tag: "[一级正文]"
      admit_id: 856
      quote: "所以，这个原则是必须明确的，例如你决定用30分钟来操作、观察时，其实就已经先假定把所有完成的5分钟走势都看成线段了。"
    - cite: "033:447"
      tier: 2
      source_tag: "[二级旁证]"
      admit_id: null
      quote: "什么叫两个同级中枢扩张？中枢扩张只针对一个中枢说的，从原来的什么级别到什么级别，哪里来两个的问题？"
    - cite: "050:48"
      tier: 2
      source_tag: "[二级旁证]"
      admit_id: null
      quote: "目前3745为上边的5分钟中枢已经扩展为30分钟的，3720到3761，短线就是这中枢的突破方向。"
    - cite: "051:80"
      tier: 2
      source_tag: "[二级旁证]"
      admit_id: null
      quote: "昨天说的三种当日中枢情况，一开盘就确认是最弱一种，因此，在这里形成中枢扩张就是理所当然的。"
    - cite: "052:248"
      tier: 2
      source_tag: "[二级旁证]"
      admit_id: null
      quote: "其实就是A+B+C=（A+B+C），而后者符合更大的中枢定义，所以就可以说A扩展了"
    - cite: "064:468"
      tier: 2
      source_tag: "[二级旁证]"
      admit_id: null
      quote: "把次级别当线段，只能看成是比喻，严格的说法，线段只存在最低级别之下。"
  literal_lean_defs: []
  history_revision: "主线建立一词一义术语表，对“扩展/扩张”、“次级别”、“Zn”（Z 走势段 / 震荡中轴 / 周线记号）、“底部”（走势类型版 / 分型版）与“线段”全部消歧并改名隔离。"

