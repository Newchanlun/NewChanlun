      quote: "对于第二种第2类，如果离该买点的形成与位置不远，可以介入，但最好就是刚形成时介入，若一旦从该买点开始已出现次级别走势的完成并形成盘整顶背驰，后面就必须等待，因为后面将是一个大级别盘整的形成，按照上面的习惯，可以不参与的，等待该盘整结束再说。"
    - cite: "052:22"
      tier: 1
      admit_id: 834
      quote: "而背驰的级别一定不小于转折的级别，是市场预测的最基础手段。"
    - cite: "077:42"
      tier: 1
      admit_id: 1200
      quote: "如果前面的底高于后面的底，那么前面的划分显然是错误的，因为按这种划分，该笔是没有完成的，一个底不经过一个顶后就有一个更低的底，这是最典型的笔没完成的情况。"
    - cite: "077:44"
      tier: 1
      admit_id: 1201
      quote: "如果前面的底不低于后面的底，那么如果再下面一个顶分型出现前，如果有一个底分型低于前面的底，那么，这两种划分都是不正确的，所划分的笔都是没完成的；"
    - cite: "077:38"
      tier: 1
      admit_id: 1198
      quote: "有了上面这基础工作，那这个图就可以看成只有这些分型，分型之间的K线都可以暂时不用管。下面的工作，就是确定笔了。笔，必须是一顶一底，而且顶和底之间至少有一个K线不属于顶分型与底分型。当然，还有一个最显然的，就是在同一笔中，顶分型中最高那K线的区间至少要有一部分高于底分型中最低那K线的区间，如果这条都不满足，也就是顶都在低的范围内或顶比底还低，这显然是不可接受的。"
    - cite: "034:22"
      tier: 1
      admit_id: 1595
      quote: "当然，走势是千变万化而有级别性的，任何的当下，并不就意味着1秒种的变化，而是根据你的资金以及承受所可能的操作级别来决定的。一直所说的操作级别，就是针对此而说。"
    - cite: "107:16"
      tier: 1
      admit_id: 1549
      quote: "首先，你必须搞清楚反弹可能的具体走势形式，因为同样是30分钟级别，不同形式，对应的对应的操作难度与方式都是不同的，而最大的难点在于，你并不能事先知道反弹究竟用什么的方式，因为这涉及预测，而一切预测都不能纳入操作计划的范围，只能聊天吹牛时使用。所以要解决这难点，必须从绝对性出发，里面不能涉及任何预测。"
    - cite: "108:18"
      tier: 1
      admit_id: 1564
      quote: "站在分型的角度，底部就是构成底分型的那个区间，而跌破分型最低点意味着底部构成失败，反之，有效站住分型区间上边沿，就意味着底部构造成功并至少展开一笔一上行情。其实，这都不是什么新鲜内容，但这里统一说出来，还是有好处的。同样，顶部反过来就是。"
    - cite: "017:618"
      tier: 2
      admit_id: null
      quote: "“某级别，类型走势中”，本ID这里有点笔误，“类型走势”应该写成“走势类型”"
    - cite: "023:1222"
      tier: 2
      admit_id: null
      quote: "由于回答的问题众多，出现个把笔误是不可避免的，有发现的请提出来，本ID没时间每个字都看得很清楚。"
    - cite: "047:116"
      tier: 2
      admit_id: null
      quote: "一个最高3892，一个最低3688，怎么没重合？"
    - cite: "051:128"
      tier: 2
      admit_id: null
      quote: "对于上海来说,今天的中枢就在2040上下"
