  exact_proposition: "043:20 与 086:78 给出的下界是某级别走势完成后必然接至少同级别的另一走势类型；而 099:30 宣称“一个走势级别完成后必然面临至少大一级别的中枢震荡”。尊重 099:24 允许后续 f\\g\\h 独立成枢而不要求刚结束的 t1 必须是成枢第一段（由 b23_existsHigherCenterAnywhereBool 在任意连续三段窗口搜寻），分立两个严格可反驳命题：（1）无缺口首尾相连但仅走出两段后续走势时仍可无高一级中枢（b23_twoFollowUpWavesForceHigherCenterLiteral，说明大一级中枢依赖后续走出至少 3 段同级走势的活性前提）；（2）允许 033:24 跳空缺口连接时，即便后续给出任意长度（≥ 3 段）交替走势并在任意三段窗口搜寻，单边梯级走势仍无高一级中枢（b23_withGapsAnyLengthForcesHigherCenterLiteral）。待下游 Chan/Audit/Math 分别证伪。"
  citations:
