- id: "B-37"
  title: "基于实际次级震荡区间中点 Zn 的无活性前提“必越出中枢区间”断言"
  target_modules:
    - "Chan.Defs.Axioms"
    - "Chan.Audit.Literal.DynamicsAndAudit"
    - "#2323"
  disposition: "定义"
  delivery_state: "待证反例陈述"
  audit_status: null
  target_audit_status: "已否证"
  exact_proposition: "092:18 将 Zn 定义为实际次级震荡区间的中点，092:22 说明其计数超过 9 个将引发次级别升级，092:16 与 092:24 则以“否则永远不会出现第三类买卖点，这显然是不可能的”为论据断言 Zn 最终肯定越出中枢区间 [A, B]。在基于实际次级震荡区间 SubOscillation（要求非退化且与 [a, b] 重叠）诱导中点 Zn 的模型下，若未显式引入活性公理（或 092:22 升级切换规则），满足全部围绕中枢前提的震荡流仍可使全部中点恒落于 [a, b] 内。待下游 Chan/Audit/Math 证伪 b37_unconditionalOscillationExitLiteral。"
  citations:
    - cite: "092:16"
      tier: 1
      source_tag: "[一级正文]"
      admit_id: 1377
      quote: "中枢震荡，最终一定以某级别的第三类买卖点结束。但问题是，如何预先给出有参考价值的提示，也就是如何去监控这震荡是在逐步走强，还是逐步走弱，这是一个有操作价值的问题。当然，顺便地，可以为每次的震荡高低点的把握给出一个大致的区间。"
    - cite: "092:18"
      tier: 1
      source_tag: "[一级正文]"
      admit_id: 1378
      quote: "一个中枢确立后，中枢区间的一半位置，称为震荡中轴Z。而每一个次级震荡区间的一半位置，依次用Zn表示，当然，最标准的状态，就是Zn刚好就是Z，但这是很特殊的例子。"
    - cite: "092:22"
      tier: 1
      source_tag: "[一级正文]"
      admit_id: 1379
      quote: "当然，只要有波动，就可以用类似中枢、走势类型之类的手段去分析，不过Zn的数量不会过于庞大，不会超过9个数据，超过了，次级别就要升级了，所以这样的分析意义不大。"
    - cite: "092:24"
      tier: 1
      source_tag: "[一级正文]"
      admit_id: 1380
      quote: "一般来说，这个指标是一个监视。这里，存在着一种必然的关系，就是最终，Zn肯定要超越A或B，为什么？如果不这样，就永远不会出现第三类买卖点了，这显然是不可能的。"
  literal_lean_defs:
    - "Chan.Audit.Literal.SubOscillation"
    - "Chan.Audit.Literal.b37_validSubOscillation"
    - "Chan.Audit.Literal.b37_midpointExitsBand"
    - "Chan.Audit.Literal.b37_unconditionalOscillationExitLiteral"
  history_revision: "基于实际次级震荡区间中点 Zn 将“必越出中枢区间”改写为条件命题（若震荡在同级内结束则必越界），无条件版本显式声明依赖活性公理（或 092:22 满九段升级切换）。"

