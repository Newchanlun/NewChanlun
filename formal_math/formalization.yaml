- id: "B-7"
  title: "笔定义存在老笔/新笔/6根/不重合四套不等价表述，且唯一性证明不完整"
  target_modules:
    - "Chan.Defs.Pen"
    - "Chan.Audit.Literal.PenAndSegment"
    - "#2323"
  disposition: "参数"
  audit_status: "未交付"
  exact_proposition: "原典成笔条件先后给出老笔（062:26/077:38，包含处理后顶底分型间至少 1 根独立 K 线）、新笔（081:110，不共用 K 线且顶底极值间原始 K 线至少 3 根）、6 根基本 K 线单位（106:16）以及分型不重合表述（099:56），四者互不等价；同时 077:40–48 唯一性证明在 077:44 将不等号写反且未交代相等同类分型保留后的归属。待下游 Chan/Audit/Math 证伪 b7_oldNewPenEquivLiteral 与 b42_penProofCasesPartitionLiteral。"
  citations:
    - cite: "062:26"
      tier: 1
      admit_id: 980
      quote: "两个相邻的顶和底之间构成一笔，所谓笔，就是顶和底之间的其他波动，都可以忽略不算，但注意，一定是相邻的顶和底，隔了几个就不是了。而所谓的线段，就是至少由三笔组成。"
    - cite: "062:26"
      tier: 1
      admit_id: 982
      quote: "在实际分析中，都必须要求顶和底之间都至少有一K线当成一笔的最基本要求。"
    - cite: "065:38"
      tier: 1
      admit_id: 1036
      quote: "第二种，在两个顶或底中间没有其他的顶和底；这种情况，意味着第一个顶或底后的转折级别太小，不足以构成值得考察的对象，这种情况下，第一个的顶或底就可以忽略其存在了，可以忽略不算了。"
    - cite: "069:20"
      tier: 1
      admit_id: 1097
      quote: "例如，第一个红箭头和第二个绿箭头之间显然不能构成一笔，也就是说，这两个，只能取一个：如果取第一个红箭头，那么第二个绿箭头就不是笔中分型，那么第二个红箭头，显然是一个底分型，因此，就形成两个底分型连续的划分，显然，这时候，第一个就不算了，这和前面说取第一个红箭头对着的底分型矛盾。所以，这里，只能取第二个绿箭头，这时候，第一个绿箭头对应的顶分型，自然就不算笔中的顶了。"
    - cite: "077:38"
      tier: 1
      admit_id: 1198
      quote: "有了上面这基础工作，那这个图就可以看成只有这些分型，分型之间的K线都可以暂时不用管。下面的工作，就是确定笔了。笔，必须是一顶一底，而且顶和底之间至少有一个K线不属于顶分型与底分型。当然，还有一个最显然的，就是在同一笔中，顶分型中最高那K线的区间至少要有一部分高于底分型中最低那K线的区间，如果这条都不满足，也就是顶都在低的范围内或顶比底还低，这显然是不可接受的。"
    - cite: "077:40"
      tier: 1
      admit_id: 1199
      quote: "因此，在确定笔的过程中，必须要满足上面的条件，这样可以唯一确定出笔的划分。这个划分的唯一性很容易证明，假设有两个都满足条件的划分，这两个划分要有所不同，必然是两个划分从第N-1笔以前都是相同的，从第N笔开始出现第一个不同，这个的N可以等于1，这样就是从一开始就不同。那么第N-1笔结束的位置的分型，显然对于两个划分的性质是一样的，都是顶或底。对于是顶的情况，那么第N笔，其底对于两个划分必然对应不同的底分型，否则这笔对两个划分就是相同的，这显然矛盾。由于分型的划分是唯一的，因此，这两种不同的划分里在第N笔对应的底分型，在顺序上必然有前后高低之分，而且在这两个底之间不可能还存在一个顶，否则这里就不是一笔了。"
    - cite: "077:42"
      tier: 1
      admit_id: 1200
      quote: "如果前面的底高于后面的底，那么前面的划分显然是错误的，因为按这种划分，该笔是没有完成的，一个底不经过一个顶后就有一个更低的底，这是最典型的笔没完成的情况。"
    - cite: "077:44"
      tier: 1
      admit_id: 1201
      quote: "如果前面的底不低于后面的底，那么如果再下面一个顶分型出现前，如果有一个底分型低于前面的底，那么，这两种划分都是不正确的，所划分的笔都是没完成的；"
    - cite: "077:54"
      tier: 1
      admit_id: 1203
      quote: "二、如果前后两分型是同一性质的，对于顶，前面的低于后面的，只保留后面的，前面那个可以X掉；对于底，前面的高于后面的，只保留后面的，前面那个可以X掉。不满足上面情况的，例如相等的，都可以先保留。"
    - cite: "106:16"
      tier: 1
      admit_id: 1532
      quote: "任一级别，都有最少的延伸时间，例如，一笔，由于必须有顶与底的分型，因此，必须至少延伸6个基本K线单位，也就是说，如果5日线都不能碰到，那就不会是笔的反弹了。"
    - cite: "076:186"
      tier: 2
      admit_id: null
      quote: "AB肯定不是一笔，BC也不是，至于AD是不是，这要看D后面的走势。"
    - cite: "081:110"
      tier: 2
      admit_id: null
      quote: "本ID想了想，计算了一下能量力度，觉得以后可以把笔的成立条件略微放松一下，就是一笔必须满足以下两个条件：1、顶分型与底分型经过包含处理后，不允许共用K线，也就是不能有一K线分别属于顶分型与底分型，这条件和原来是一样的，这一点绝对不能放松，因为这样，才能保证足够的能量力度；2、在满足1的前提下，顶分型中最高K线和底分型的最低K线之间（不包括这两K线），不考虑包含关系，至少有3根（包括3根）以上K线。"
    - cite: "081:160"
      tier: 2
      admit_id: null
      quote: "本ID自己一直用老标准，因为本ID从来只用一套软件。但这理论公开，就有一个适应性的问题，毕竟不能要求所有人只用一套软件，所以稍微改改，又不影响最终的判断，又何妨？"
    - cite: "099:56"
      tier: 2
      admit_id: null
      quote: "因为笔的最基本条件就是顶和底分型之间必须有不重合的部分"
