- id: "B-1"
  title: "级别升级三套互不等价规则（延伸无上限 / 九段升级 / 同级别分解）"
  target_modules:
    - "Chan.Defs.Level"
    - "Chan.Audit.Literal.SignalsAndLevels"
    - "#2323"
  disposition: "定义"
  audit_status: "未交付"
  exact_proposition: "原典对围绕同一中枢持续震荡的级别升级给出三套互不等价规则：规则甲（018:40/020:34/020:44，延伸无上限，当且仅当两同级中枢波动区间重叠才升级）、规则乙（033:16/092:22/032:165，延伸满九段即升格高一级中枢）、规则丙（038:26/041:259，同级别分解不定义延伸，每三段切分为盘整+盘整）。字面断言 b1_threeLevelRulesAgreeLiteral 在围绕同一中枢震荡 12 段的输入上产生互斥级别塔，待下游 Chan/Audit/Math 给出形式化反例证伪。"
  citations:
    - cite: "018:40"
      tier: 1
      admit_id: 193
      quote: "例如一个盘整，三个重叠的连续次级别走势类型后，盘整就可以随时完成，也就是说，只要三个重叠的连续次级别走势类型走出来后，盘整随时结束都是完美的，但这可以不结束，可以不断延伸下去，不断围绕这缠中说禅中枢上上下下地延伸下去直到无穷都是可以的。"
    - cite: "020:34"
      tier: 1
      admit_id: 253
      quote: "一个简单的例子就能区别以上的情况：例如，一个股票开盘立刻封涨停，那么，只能算是一分钟级别上出现了走势中枢的延伸，无论这个延伸有多长时间，都不可能产生更大级别的走势中枢。"
    - cite: "020:44"
      tier: 1
      admit_id: 259
      quote: "缠中说禅走势级别延续定理二：更大级别缠中说禅走势中枢产生，当且仅当围绕连续两个同级别缠中说禅走势中枢产生的波动区间产生重叠。"
    - cite: "033:16"
      tier: 1
      admit_id: 584
      quote: "这种情况，只要对中枢延伸的数量进行限制，就可以消除多义性，一般来说，中枢的延伸不能超过5段，也就是一旦出现6段的延伸，加上形成中枢本身那三段，就构成更大级别的中枢了。"
    - cite: "092:22"
      tier: 1
      admit_id: 1379
      quote: "当然，只要有波动，就可以用类似中枢、走势类型之类的手段去分析，不过Zn的数量不会过于庞大，不会超过9个数据，超过了，次级别就要升级了，所以这样的分析意义不大。"
    - cite: "038:26"
      tier: 1
      admit_id: 663
      quote: "因此，完全合理、不违反任何理论原则的，可以制定出这样的同级别分解规则：在某级别中，不定义中枢延伸，允许该级别上的盘整+盘整连接；与此同时，规定该级别以下的所有级别，都允许中枢延伸，不允许盘整+盘整连接；至于该级别以上级别，根本不考虑，因为所有走势都按该级别给分解了。"
    - cite: "017:530"
      tier: 2
      admit_id: null
      quote: "什么叫至少？如果一万年在一个区间里，那还是一个中枢。"
    - cite: "032:165"
      tier: 2
      admit_id: null
      quote: "延伸不能超过9个次级别，否则就变成更大级别的，这根据定义很容易理解。"
    - cite: "041:259"
      tier: 2
      admit_id: null
      quote: "同级别分解，不允许盘整里的中枢延伸，因此3段次级别就是了，不存在任意的问题。"
    - cite: "069:423"
      tier: 2
      admit_id: null
      quote: "5分钟中枢，只要3个1分钟走势类型有重合就可以，不是一定要里面的所有段都重合。"
    - cite: "095:86"
      tier: 2
      admit_id: null
      quote: "这里有两种途径，一种是9次级别的震荡扩展出5分钟，一种是先1分钟的第三类卖点后底背驰上来再出来5分钟。"
    - cite: "066:186"
      tier: 2
      admit_id: null
      quote: "不一定。按3+3+3这样组合后确定5分钟的。"
    - cite: "059:56"
      tier: 2
      admit_id: null
      quote: "上面说的42-45的1分钟中枢，已经延伸9段，成为一个5分钟中枢了"
  literal_lean_defs:
    - "Chan.Audit.Literal.LevelRuleOutcome"
    - "Chan.Audit.Literal.b1_ruleA_unboundedExtLiteral"
    - "Chan.Audit.Literal.b1_ruleB_nineSegUpgradeLiteral"
    - "Chan.Audit.Literal.b1_ruleC_sameLevelDecompLiteral"
    - "Chan.Audit.Literal.b1_threeLevelRulesAgreeLiteral"
  history_revision: "主线唯一定义高一级中枢为三个连续本级别走势类型公共重叠，并将延伸满九段（3+3+3）定为规范化进位公理，同级别分解单列。"

- id: "B-2"
  title: "“三段相连必有重叠”及“无单点边界重叠”字面断言为假"
  target_modules:
    - "Chan.Defs.Center"
    - "Chan.Audit.Literal.OrderAndCenter"
    - "#2323"
  disposition: "定义"
  audit_status: "未交付"
  exact_proposition: "答疑 019:1058 宣称首尾相连且方向交替的三段（如 N 字上下上）必然有重叠且不可能仅有边界单点重叠；正文 067:16 亦在未明写线段终止前提下断言任何 Si 与 Si+1 必有重合。实际上 [10,12]→[12,5]→[5,8] 三段公共交集为空，[10,12]→[12,8]→[8,10] 仅交于单点 10。待下游 Chan/Audit/Math 证伪 b2_connectedThreeAlwaysOverlapLiteral 与 b2_connectedThreeNoBoundaryOnlyLiteral。"
  citations:
    - cite: "065:48"
      tier: 1
      admit_id: 1040
      quote: "线段有一个最基本的前提，就是线段的前三笔，必须有重叠的部分，这个前提在前面可能没有特别强调，这里必须特别强调一次。线段至少有三笔，但并不是连续的三笔就一定构成线段，这三笔必须有重叠的部分。"
    - cite: "067:16"
      tier: 1
      admit_id: 1059
      quote: "以向上笔开始的线段，可以用笔的序列表示：S1X1S2X2S3X3…SnXn。容易证明，任何Si与Si+1之间，一定有重合区间。而考察序列X1X2…Xn，该序列中，\u00a0Xi与Xi+1之间并不一定有重合区间，因此，这序列更能代表线段的性质。"
    - cite: "019:1058"
      tier: 2
      admit_id: null
      quote: "你说这话证明你连三段怎么找都没搞清楚，三段是互相连着的，三段必然有重叠，根本没有可能有什么光边界重叠的情况。"
    - cite: "019:1058"
      tier: 2
      admit_id: null
      quote: "一个最简单的例子，你自己画一个N字，上、下、上，无论你怎么画都画不出一个没重合的。"
    - cite: "031:912"
      tier: 2
      admit_id: null
      quote: "临走回答你，那就不形成中枢，谁告诉你下上下一定形成中枢的？没重叠哪里有中枢？"
  literal_lean_defs:
    - "Chan.Audit.Literal.b2_connectedAltTriple"
    - "Chan.Audit.Literal.b2_tripleCommonOverlap"
    - "Chan.Audit.Literal.b2_tripleStrictOverlap"
    - "Chan.Audit.Literal.b2_connectedThreeAlwaysOverlapLiteral"
    - "Chan.Audit.Literal.b2_connectedThreeNoBoundaryOnlyLiteral"
  history_revision: "主线将三段重叠全部写为数据判定谓词而非恒真式，并将 067:16 改写为带线段终止规则前提的待证引理。"

- id: "B-3"
  title: "五个核心谓词等号边界口径冲突（020:60 含等号三买卖 vs 054:24 边界相触属震荡）"
  target_modules:
    - "Chan.Defs.Order"
    - "Chan.Defs.Center"
    - "Chan.Audit.Literal.OrderAndCenter"
    - "#2323"
  disposition: "定义"
  audit_status: "未交付"
  exact_proposition: "正文 020:60 对第三类买点字面写作“低点不跌破 ZG”（含等号 ≥），其对偶卖点允许回抽高点等于 ZD；而正文 054:24 明确判定 d1=g2 时属中枢震荡、必须严格 d1>g2 才是第三类卖点。同时中枢重叠、包含关系、背驰力度与数值相等五个谓词的等号口径散落各处。待下游 Chan/Audit/Math 证伪 b3_literalThirdDisjointFromOscillation。"
  citations:
    - cite: "020:56"
      tier: 1
      admit_id: 265
      quote: "缠中说禅走势中枢中心定理一：走势中枢的延伸等价于任意区间[dn，gn]与[ZD，ZG]有重叠。换言之，若有Zn，使得dn>ZG或gn<ZD，则必然产生高级别的走势中枢或趋势及延续。"
    - cite: "020:60"
      tier: 1
      admit_id: 296
      quote: "一个次级别走势类型向上离开缠中说禅走势中枢，然后以一个次级别走势类型回试，其低点不跌破ZG，则构成第三类买点"
    - cite: "054:24"
      tier: 1
      admit_id: 869
      quote: "当走势发展到d2时，一个1分钟级别的中枢就形成，区间是[d1,g1]。后面出现的线段，就要以该区间来决定是中枢震荡还是第三类买卖点。由于d1=g2，那么d2g2这段就属于[d1,g1]中枢的震荡。而到d3g3这段，显然已经不能触及[d1,g1]，所以g3就是第三类卖点。当然，如果前面d1>g2，那g2就是第三类卖点了。"
    - cite: "054:198"
      tier: 2
      admit_id: null
      quote: "严格按理论来，如果一个价位就不算，那两个算不算？这样就乱了。只要有重叠就是，而且，有时候1个价位反而更有意义，这一般都是里面主力资金的杰作。"
    - cite: "075:105"
      tier: 2
      admit_id: null
      quote: "只要有一端相同，那必然是包含，两端相同那更是了，所以如果不是包含关系的，都必然不需要考虑相等关系。"
    - cite: "051:246"
      tier: 2
      admit_id: null
      quote: "不一定要缩小，不大于就可以"
    - cite: "075:175"
      tier: 2
      admit_id: null
      quote: "包含关系中的相等，必须是绝对相等，也就是说必须在软件上最后一位小数都相等。"
  literal_lean_defs:
    - "Chan.Audit.Literal.CenterCore"
    - "Chan.Audit.Literal.b3_thirdBuyLiteral"
    - "Chan.Audit.Literal.b3_thirdSellLiteral"
    - "Chan.Audit.Literal.b3_touchesCenterOscillation"
    - "Chan.Audit.Literal.b3_literalThirdDisjointFromOscillation"
  history_revision: "主线逐个写死五个谓词等号：中枢重叠取闭区间（单点算）、三买卖取严格不等、包含取非严格、背驰力度取不大于、价格取绝对精确相等。"

- id: "B-4"
  title: "走势分解“唯一性”与“多样性”并存导致买卖点依赖所选分解"
  target_modules:
    - "Chan.Defs.Decomposition"
    - "#2323"
  disposition: "定义"
  audit_status: "已分离"
  exact_proposition: "原典一方面宣称绝对证明了走势分解的唯一性（038:18/084:30/101:52），另一方面反复强调基于结合律的分解多样性，并在 054:58 明确给出同一段走势在第二种分解下 g7 不再构成第三类卖点的实例。分解唯一性至多对固定规范分解规则成立，买卖点是 (走势, 分解) 的二元谓词而非走势本身的一元函数。"
  citations:
    - cite: "038:18"
      tier: 1
      admit_id: 661
      quote: "所谓同级别分解，就是把所有走势按一固定级别的走势类型进行分解。根据“缠中说禅走势分解定理”，同级别分解具有唯一性，不存在任何含糊乱分解的可能。"
    - cite: "084:30"
      tier: 1
      admit_id: 1295
      quote: "本ID的理论，是人类历史上第一次用100%理论推导的方式绝对地证明了走势分解的唯一性，这从上面关于笔、线段等分解的唯一性证明就明白，世界有哪种交易理论，是按这种绝对推理的方式构成的？显然没有，这才是本ID理论的最强大力量所在，前两个客观点如果没有最后这第三点，都是瞎掰。"
    - cite: "101:52"
      tier: 1
      admit_id: 1444
      quote: "所谓走势必完美，就是本ID所给出的分型、笔、线段、不同级别走势类型所对应的递归函数，能将行情的任何走势唯一地分解。"
    - cite: "054:46"
      tier: 1
      admit_id: 873
      quote: "这就是反复强调的分解多样性的好处，一般来说，对于具体操作，一定要选择当下有明确意义的分解，例如是中枢震荡的，或有第三类买卖点的，但一定要注意，所有的分解必须符合分解的原则，否则就乱套了。"
    - cite: "054:58"
      tier: 1
      admit_id: 876
      quote: "相应的5分钟中枢区间就是[d3，g5]，在这种情况下，d7g7也是一个中枢震荡，但不构成第三类卖点，因为不符合条件。"
    - cite: "057:40"
      tier: 1
      admit_id: 922
      quote: "当行情走到6点时，34、45、56这三段，就可以看成是一个1分钟中枢了，当然，这种分法和原来[4087，4122]中枢的分解不同，但站在多义性的角度，这是绝对符合结合律的，当然是一个分解的方法。"
    - cite: "060:38"
      tier: 1
      admit_id: 953
      quote: "因为走势本身就是当下形成中的，是市场各种预期的合力当下画出来的，而每种画法都是不患的，都是源自人的贪嗔痴疑慢，因此每种多样性的分解都是符合理论的，多样性不是模糊性，而是多角度去让市场本身自己去画地为牢，由此使得市场的走势万变不离本ID理论的控制之中，而这，恰好是市场自身的规律之一。"
    - cite: "099:22"
      tier: 1
      admit_id: 1422
      quote: "另外，根据结合律，连接中枢的走势，并不一定是完全的趋势类型，也就是说，一个线段类上涨后，可能第二类类中枢就消融在中阴状态的那个中枢里了。也就是说，a+b+c+d+e+f=\u00a0a+b+c+（d+e+f），a+b+c+d+e是一个线段类上涨，c+d+e的重合部分构成最后的一个类中枢，f是类背驰后的回调，这时候，就可以马上构成一个1分钟的中枢，然后后面直接继续上涨，构成1分钟的上涨是完全合理的。因为，最终的划分，就必须把a+b+c+d+e给拆开了。"
    - cite: "059:42"
      tier: 1
      admit_id: 945
      quote: "但无论如何分解，19-45至少是一个未完成5分钟走势类型的结论不变。"
    - cite: "099:26"
      tier: 1
      admit_id: 1424
      quote: "如果后面包括d+e+f延伸出9段，然后又直接上去了，划分中，必须首先保证5分钟中枢的成立。换言之，划分的原则很明确，就是必须保证中枢的确立，在这前提下，可以根据结合律，使得连接中枢的走势保持最完美的形态。"
    - cite: "082:132"
      tier: 2
      admit_id: null
      quote: "为什么要一致？低级图上用中枢、走势类型。高级图上用分型，线段，等于有两套有用的工具去分析同一走势，这是天大的好事。"
  literal_lean_defs: []
  history_revision: "主线区分合法分解集 Dec(w) 与规范分解 can(w)，并将买卖点显式定义为依赖分解的二元谓词 P(w, d)。"

- id: "B-5"
  title: "递归基底先后出现四种不同定义（三根 K 线 / 三笔同价成交 / 线段 / 分型）"
  target_modules:
    - "Chan.Defs.Base"
    - "#2323"
  disposition: "参数"
  audit_status: "已分离"
  exact_proposition: "原典对递归塔最底层的定义先后给出三根单位 K 线重叠（017:40）、连续三笔同价成交（035:16）、线段（063:22）和任意设计的分型 a0（101:58/084:54），四者在同一输入上产出的最小中枢互不相同；且“如何设计都不影响唯一分解证明”忽略了基底自身必须满足唯一性与方向交替前提，“笔作基底稳定性极差”亦未定义稳定性度量。"
  citations:
    - cite: "017:40"
      tier: 1
      admit_id: 137
      quote: "这里有一个递归的问题，就是这次级别不能无限下去，就像有些半吊子哲学胡诌什么，而“分”不是无限的，按照量子力学，物质之分是有极限的，同样，级别之次也不可能无限，在实际之中，对最后不能分解的级别，其缠中说禅走势中枢就不能用“至少三个连续次级别走势类型所重叠”定义，而定义为至少三个该级别单位K线重叠部分。"
    - cite: "035:16"
      tier: 1
      admit_id: 618
      quote: "最严格去定义，每笔的交易是最低级别的，连续三笔相同价位的交易，就构成最低级别的中枢。"
    - cite: "063:22"
      tier: 1
      admit_id: 991
      quote: "如果我们首先确立了显微镜的倍数，也就是说，例如我们把1分钟图作为最基本的图，那么就可以开始定义上一课程说的分型、笔、线段等等。有了线段，就可以定义1分钟的中枢，然后就是1分钟的走势类型，然后按照递归的方法，可以逐步定义5分钟、30分钟、日、周、月、季度、年的中枢和走势类型。"
    - cite: "101:58"
      tier: 1
      admit_id: 1446
      quote: "分型等于递归函数的a0，这完全可以随意设计，如何设计都不会影响到唯一分解定理的证明。"
    - cite: "084:54"
      tier: 1
      admit_id: 1299
      quote: "本ID关于中枢等的定义，其实一直没有改变过，因为中枢定义的关键，在于定义的递归性。一般的递归定义，由两部分组成，一、f1(a0)=a1；二、f2(an)=an+1；关于第二条的中枢过程规则，是一直没有任何改变的，而关于第一条，其实，可以随意设置任何的，都不会改变中枢定义的递归性。而且，任何有点数学常识的都知道，f1(a0)=a1之前是不需要再有什么递归性的，也就是，一和二之间的f1、f2可以是完全不同的两个函数。"
    - cite: "083:14"
      tier: 1
      admit_id: 1284
      quote: "一个最简单的问题，为什么不能由笔构成最小中枢？其实，这不是一个问题。为什么？因为实质上，我们是可以设计这样的程序，也就是用笔当成构成最小中枢的零件，但这样构造出来的系统，其稳定性极差。"
    - cite: "080:436"
      tier: 2
      admit_id: null
      quote: "没有推翻，这个问题说得很清楚。原来的中枢定义，是纯理论的，因此，操作起来很麻烦，因为没有人真能从每一笔成交开始看。"
  literal_lean_defs: []
