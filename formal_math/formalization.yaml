      source_tag: "[一级正文]"
      admit_id: 1198
      quote: "有了上面这基础工作，那这个图就可以看成只有这些分型，分型之间的K线都可以暂时不用管。下面的工作，就是确定笔了。笔，必须是一顶一底，而且顶和底之间至少有一个K线不属于顶分型与底分型。当然，还有一个最显然的，就是在同一笔中，顶分型中最高那K线的区间至少要有一部分高于底分型中最低那K线的区间，如果这条都不满足，也就是顶都在低的范围内或顶比底还低，这显然是不可接受的。"
    - cite: "077:40"
      tier: 1
      source_tag: "[一级正文]"
      admit_id: 1199
      quote: "因此，在确定笔的过程中，必须要满足上面的条件，这样可以唯一确定出笔的划分。这个划分的唯一性很容易证明，假设有两个都满足条件的划分，这两个划分要有所不同，必然是两个划分从第N-1笔以前都是相同的，从第N笔开始出现第一个不同，这个的N可以等于1，这样就是从一开始就不同。那么第N-1笔结束的位置的分型，显然对于两个划分的性质是一样的，都是顶或底。对于是顶的情况，那么第N笔，其底对于两个划分必然对应不同的底分型，否则这笔对两个划分就是相同的，这显然矛盾。由于分型的划分是唯一的，因此，这两种不同的划分里在第N笔对应的底分型，在顺序上必然有前后高低之分，而且在这两个底之间不可能还存在一个顶，否则这里就不是一笔了。"
    - cite: "077:54"
      tier: 1
      source_tag: "[一级正文]"
      admit_id: 1203
      quote: "二、如果前后两分型是同一性质的，对于顶，前面的低于后面的，只保留后面的，前面那个可以X掉；对于底，前面的高于后面的，只保留后面的，前面那个可以X掉。不满足上面情况的，例如相等的，都可以先保留。"
    - cite: "106:16"
      tier: 1
      source_tag: "[一级正文]"
      admit_id: 1532
      quote: "任一级别，都有最少的延伸时间，例如，一笔，由于必须有顶与底的分型，因此，必须至少延伸6个基本K线单位，也就是说，如果5日线都不能碰到，那就不会是笔的反弹了。"
    - cite: "076:186"
      tier: 2
      source_tag: "[二级旁证]"
      admit_id: null
      quote: "AB肯定不是一笔，BC也不是，至于AD是不是，这要看D后面的走势。"
    - cite: "081:110"
      tier: 2
      source_tag: "[二级旁证]"
      admit_id: null
      quote: "本ID想了想，计算了一下能量力度，觉得以后可以把笔的成立条件略微放松一下，就是一笔必须满足以下两个条件：1、顶分型与底分型经过包含处理后，不允许共用K线，也就是不能有一K线分别属于顶分型与底分型，这条件和原来是一样的，这一点绝对不能放松，因为这样，才能保证足够的能量力度；2、在满足1的前提下，顶分型中最高K线和底分型的最低K线之间（不包括这两K线），不考虑包含关系，至少有3根（包括3根）以上K线。"
    - cite: "081:160"
      tier: 2
      source_tag: "[二级旁证]"
      admit_id: null
      quote: "本ID自己一直用老标准，因为本ID从来只用一套软件。但这理论公开，就有一个适应性的问题，毕竟不能要求所有人只用一套软件，所以稍微改改，又不影响最终的判断，又何妨？"
    - cite: "099:56"
      tier: 2
      source_tag: "[二级旁证]"
      admit_id: null
      quote: "因为笔的最基本条件就是顶和底分型之间必须有不重合的部分"
  literal_lean_defs:
    - "Chan.Audit.Literal.b7_validPenEndpointsFromBarsBool"
    - "Chan.Audit.Literal.b7_oldPenFromBars"
    - "Chan.Audit.Literal.b7_newPenFromBars"
    - "Chan.Audit.Literal.b7_lesson106PenFromBars"
    - "Chan.Audit.Literal.b7_oldNewPenRuleSeparated"
