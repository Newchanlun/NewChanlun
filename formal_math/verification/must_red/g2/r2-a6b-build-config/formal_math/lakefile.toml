name = "fixture"
defaultTargets = ["Chan"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
linter.unusedVariables = true

[[lean_lib]]
name = "Chan"
globs = ["Chan.*"]
moreLeanArgs = ["-DwarningAsError=false"]

[[lean_lib]]
name = "ChanTest"
roots = ["ChanTest.Probe"]

[[lean_exe]]
name = "fm_audit"
root = "verification.Audit"
supportInterpreter = true

[[lean_lib]]
name = "FMEnvGates"
roots = ["verification.EnvGates", "verification.SourceGates"]
