name: AT-18 simulation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      registry_sha: ${{ steps.plan.outputs.registry_sha }}
      has_groups: ${{ steps.plan.outputs.has_groups }}
      groups: ${{ steps.plan.outputs.groups }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r scripts/at18/requirements.txt
      - id: plan
        run: python scripts/at18/workflow.py plan simulation

  checks:
    if: needs.plan.outputs.has_groups == 'true'
    needs: plan
    name: at18 ${{ matrix.group }} ${{ needs.plan.outputs.registry_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.groups) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r scripts/at18/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Sandcastle's locked TypeScript test loader
        if: matrix.group == 'r11-node'
        run: npm ci --ignore-scripts
      - id: run
        env:
          AT18_GROUP: ${{ matrix.group }}
        run: python scripts/at18/workflow.py run simulation --group="$AT18_GROUP" --output "$RUNNER_TEMP/at18-execution"
      # 矩阵作业输出键会相互覆盖；Jobs API 的成功上传 step 保留每组独立锚。
      - name: at18-anchor ${{ steps.run.outputs.execution_sha }}
        uses: actions/upload-artifact@v4
        if: steps.run.outcome == 'success'
        with:
          name: at18-${{ github.run_attempt }}-simulation-g-${{ matrix.group }}
          path: ${{ runner.temp }}/at18-execution/
          if-no-files-found: error
          retention-days: 14

  scaffold:
    if: needs.plan.outputs.has_groups == 'false'
    needs: plan
    # 不占 R06 业务组名，也不生产 R07 运行原件。
    name: at18-scaffold simulation ${{ needs.plan.outputs.registry_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r scripts/at18/requirements.txt
      - id: run
        run: python scripts/at18/workflow.py run simulation --output "$RUNNER_TEMP/at18-scaffold"
      - name: at18-anchor ${{ steps.run.outputs.execution_sha }}
        uses: actions/upload-artifact@v4
        with:
          name: at18-${{ github.run_attempt }}-simulation-scaffold
          path: ${{ runner.temp }}/at18-scaffold/
          if-no-files-found: error
          retention-days: 14

  seal_plan:
    permissions:
      contents: read
      actions: read
    needs: [plan, checks, scaffold]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' &&
      ((needs.plan.outputs.has_groups == 'true' && needs.checks.result == 'success' && needs.scaffold.result == 'skipped') ||
       (needs.plan.outputs.has_groups == 'false' && needs.scaffold.result == 'success' && needs.checks.result == 'skipped')) }}
    name: at18-seal-plan simulation ${{ needs.plan.outputs.registry_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      has_seals: ${{ steps.plan.outputs.has_seals }}
      scaffold_sha: ${{ steps.plan.outputs.scaffold_sha }}
      seals: ${{ steps.plan.outputs.seals }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r scripts/at18/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: at18-${{ github.run_attempt }}-simulation-*
          path: ${{ runner.temp }}/at18-input
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/at18/workflow.py seal-plan simulation --artifacts "$RUNNER_TEMP/at18-input"

  seal_scaffold:
    needs: [plan, seal_plan, checks, scaffold]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' && needs.seal_plan.result == 'success' &&
      needs.plan.outputs.has_groups == 'false' && needs.checks.result == 'skipped' &&
      needs.scaffold.result == 'success' && needs.seal_plan.outputs.scaffold_sha != '' }}
    name: at18-seal-scaffold simulation ${{ needs.plan.outputs.registry_sha }} ${{ needs.seal_plan.outputs.scaffold_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r scripts/at18/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: at18-${{ github.run_attempt }}-simulation-scaffold
          path: ${{ runner.temp }}/at18-input
      - env:
          AT18_SHA: ${{ needs.seal_plan.outputs.scaffold_sha }}
        run: >-
          python scripts/at18/workflow.py seal-scaffold simulation
          --sha256="$AT18_SHA" --artifacts "$RUNNER_TEMP/at18-input" --output "$RUNNER_TEMP/at18-sealed-scaffold"
      - uses: actions/upload-artifact@v4
        with:
          name: at18-${{ github.run_attempt }}-simulation-sealed-scaffold
          path: ${{ runner.temp }}/at18-sealed-scaffold/
          if-no-files-found: error
          retention-days: 14

  seal:
    needs: [plan, seal_plan, checks, scaffold]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' && needs.seal_plan.result == 'success' &&
      needs.plan.outputs.has_groups == 'true' && needs.checks.result == 'success' &&
      needs.scaffold.result == 'skipped' && needs.seal_plan.outputs.has_seals == 'true' }}
    name: at18-seal ${{ matrix.record }} ${{ matrix.profile }} ${{ needs.plan.outputs.registry_sha }} ${{ matrix.sha256 }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.seal_plan.outputs.seals) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r scripts/at18/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: at18-${{ github.run_attempt }}-simulation-g-${{ matrix.group }}
          path: ${{ runner.temp }}/at18-input
      - env:
          AT18_GROUP: ${{ matrix.group }}
          AT18_RECORD: ${{ matrix.record }}
          AT18_PROFILE: ${{ matrix.profile }}
          AT18_SHA: ${{ matrix.sha256 }}
          AT18_EXECUTION_SHA: ${{ matrix.execution_sha }}
        run: >-
          python scripts/at18/workflow.py seal simulation
          --group="$AT18_GROUP" --record="$AT18_RECORD"
          --profile="$AT18_PROFILE" --sha256="$AT18_SHA" --execution-sha="$AT18_EXECUTION_SHA" --artifacts "$RUNNER_TEMP/at18-input"
